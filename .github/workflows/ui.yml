# DRAFT — CI only (i18n parity, typecheck, build). Nothing is deployed.
name: UI

on:
  push:
    branches: [main]
    paths:
      - "meanchey-grilled-chicken-ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "meanchey-grilled-chicken-ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: meanchey-grilled-chicken-ui

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meanchey-grilled-chicken-ui/package-lock.json

      - name: Install dependencies (from package-lock.json)
        run: npm ci

      - name: i18n key parity (km / en)
        run: npm run check:i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Same-origin setup: the API is served under /api on the same domain.
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Upload build (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: meanchey-grilled-chicken-ui/dist
          retention-days: 7

  # --- Later (deployment) --------------------------------------------------------------
  # deploy:
  #   needs: build
  #   if: github.ref == 'refs/heads/main'
  #   environment: production
  #   Download `ui-dist` and publish it as a static SPA (fallback to index.html) on the same
  #   HTTPS domain that reverse-proxies /api/* (incl. /api/telegram/webhook) to the API.
